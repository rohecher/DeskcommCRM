name: Publicar imagem Docker (GHCR)

# Builda a imagem GENÉRICA do app e publica no GitHub Container Registry.
# O leigo puxa essa imagem no VPS (não builda lá). Roda nos runners do GitHub,
# então o build pesado (~6min) nunca cai no VPS do usuário.

# A `cajado` está aqui porque ela é O PRODUTO neste fork, não uma branch de
# trabalho: a `main` é espelho do upstream e nunca recebe código nosso. Sem esta
# linha, todo deploy dependeria de lembrar de disparar o workflow na mão — e o
# esquecimento não avisa: o redeploy sobe a imagem ANTERIOR, com cara de sucesso.
on:
  push:
    tags: ["v*"]
    branches: ["main", "cajado"]
  release:
    types: [published]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push (imagem genérica — sem segredos)
        uses: docker/build-push-action@v7
        with:
          context: .
          # linux/amd64: o VPS HostGator e a imagem do WAHA são amd64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Sem build-args de segredo: a imagem é genérica (NEXT_PUBLIC_* viram
          # placeholder; valores reais entram em runtime no VPS do usuário).

      # Deploy no Dokploy DEPOIS que a imagem existe — e não pelo webhook de push
      # do Dokploy. O webhook dispara no instante do push, ~6min antes de esta
      # imagem ficar pronta: o Dokploy puxaria a `:cajado` ANTERIOR e o deploy
      # apareceria como sucesso sem mudar nada. Chamar daqui é a única ordem certa.
      #
      # Só a `cajado` vai para a produção. Sem os três segredos o passo avisa e
      # sai limpo: o build continua valendo e o deploy segue possível na mão.
      - name: Deploy no Dokploy (produção)
        if: github.ref == 'refs/heads/cajado'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::Deploy automático desligado: faltam DOKPLOY_URL, DOKPLOY_API_KEY ou DOKPLOY_COMPOSE_ID nos segredos do repositório."
            exit 0
          fi
          status=$(curl -sS -o resposta.json -w '%{http_code}' -X POST \
            "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\",\"title\":\"GitHub Actions ${GITHUB_SHA::7}\"}")
          echo "Dokploy respondeu HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat resposta.json
            echo "::error::O Dokploy recusou o deploy (HTTP $status). A imagem foi publicada; faça o deploy pelo painel."
            exit 1
          fi
