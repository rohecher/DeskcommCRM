name: Publicar imagem Docker (GHCR)

# Builda a imagem GENÉRICA do app e publica no GitHub Container Registry.
# O leigo puxa essa imagem no VPS (não builda lá). Roda nos runners do GitHub,
# então o build pesado (~6min) nunca cai no VPS do usuário.

# A `cajado` está aqui porque ela é O PRODUTO neste fork, não uma branch de
# trabalho: a `main` é espelho do upstream e nunca recebe código nosso. Sem esta
# linha, todo deploy dependeria de lembrar de disparar o workflow na mão — e o
# esquecimento não avisa: o redeploy sobe a imagem ANTERIOR, com cara de sucesso.
on:
  push:
    tags: ["v*"]
    branches: ["main", "cajado"]
  release:
    types: [published]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push (imagem genérica — sem segredos)
        uses: docker/build-push-action@v7
        with:
          context: .
          # linux/amd64: o VPS HostGator e a imagem do WAHA são amd64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Sem build-args de segredo: a imagem é genérica (NEXT_PUBLIC_* viram
          # placeholder; valores reais entram em runtime no VPS do usuário).

      # Deploy no Dokploy DEPOIS que a imagem existe. O webhook do Dokploy não
      # pode ficar cadastrado no GitHub (Settings → Webhooks): ele dispararia no
      # instante do push, ~6min antes de esta imagem ficar pronta, e o Dokploy
      # puxaria a `:cajado` ANTERIOR com cara de sucesso. Quem chama o webhook é
      # este passo, quando a imagem já está no GHCR.
      #
      # O handler do Dokploy (pages/api/deploy/compose/[refreshToken].ts) só
      # aceita a chamada se o serviço estiver com Autodeploy LIGADO e se o branch
      # vier no formato do GitHub — cabeçalho `x-github-event` e `ref` no corpo —
      # igual ao branch configurado no serviço. Branch diferente volta 301.
      #
      # Sem o segredo o passo avisa e sai limpo: o build continua valendo e o
      # deploy segue possível pelo painel.
      - name: Deploy no Dokploy (produção)
        if: github.ref == 'refs/heads/cajado'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          MENSAGEM: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::notice::Deploy automático desligado: falta o segredo DOKPLOY_WEBHOOK_URL."
            exit 0
          fi
          corpo=$(jq -n --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" --arg msg "${MENSAGEM:-deploy pelo GitHub Actions}" \
            '{ref: $ref, after: $sha, head_commit: {id: $sha, message: ($msg | split("\n")[0])}, commits: []}')
          status=$(curl -sS -o resposta.json -w '%{http_code}' -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -d "$corpo")
          echo "Dokploy respondeu HTTP $status"
          cat resposta.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::O Dokploy não fez o deploy (HTTP $status). Confira se o Autodeploy está ligado e se o branch do serviço é 'cajado'. A imagem foi publicada; dá para fazer o deploy pelo painel."
            exit 1
          fi
